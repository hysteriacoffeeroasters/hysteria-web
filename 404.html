<!-- Reutiliza el diseño del hub de enlaces a propósito: misma columna centrada,
     mismos botones y mismos 44 px de toque, sin una sola regla de CSS nueva.

     Es una página estática y no puede saber en qué idioma buscaba quien llegó
     aquí, así que el mensaje va en los dos y los accesos llevan a la portada de
     cada idioma. No lleva idioma.js: traduciría la mitad española y dejaría la
     inglesa duplicada. -->
<body class="hub">

<main class="hub-wrap" id="contenido">

  <header class="hub-head">
    <img class="hub-logo" src="/assets/logo/imagotipo-white.png"
         alt="Hysteria Coffee Roasters" width="640" height="1031">
    <p class="hub-lema">Esta página no existe</p>
    <p class="hub-sub">This page doesn’t exist</p>
  </header>

  <nav class="hub-links" aria-label="Secciones">
    <a class="hub-link destacado" href="/">
      <span class="hub-link-tit">Ir a la portada</span>
      <span class="hub-link-sub">Café de especialidad · Bogotá</span>
    </a>
    <a class="hub-link" href="/tienda">
      <span class="hub-link-tit">Comprar café</span>
      <span class="hub-link-sub">Envíos a toda Colombia</span>
    </a>
    <a class="hub-link" href="/en">
      <span class="hub-link-tit">Go to the home page</span>
      <span class="hub-link-sub">Specialty coffee · Bogotá</span>
    </a>
  </nav>

  <p class="hub-pie">
    <a href="/enlaces">Todos los enlaces</a>
  </p>

</main>

</body>
